<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workout Tracker">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Workout Tracker</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#20242d;--txt:#eef0f4;--mut:#8b93a3;--acc:#ff6b35;--ok:#2ecc71;--bad:#e5484d;--line:#2a2f3a;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{padding:14px 14px calc(150px + var(--safe));max-width:640px;margin:0 auto}
h1{font-size:26px;margin:6px 0 14px}h2{font-size:17px;margin:20px 0 8px;color:var(--mut);font-weight:600}
.muted{color:var(--mut)}.sm{font-size:13px}
input,select{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;width:100%;min-width:0}
input:focus,select:focus{outline:2px solid var(--acc);border-color:transparent}
button{font:inherit;color:var(--txt);background:var(--card2);border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
button:active{opacity:.7}
.btn{font-weight:600}.btn.big{width:100%;padding:14px;margin:8px 0;background:var(--acc);color:#fff}
.btn.sm{padding:8px 12px;font-size:14px}.btn.acc{background:var(--acc);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--mut)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.card{background:var(--card);border-radius:14px;padding:12px;margin:10px 0}
.row-b{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row-b>div{min-width:0}
.title{font-size:20px;font-weight:700;background:transparent;border:0;padding:6px 0}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}
.stats3>div{background:var(--card);border-radius:12px;padding:8px 10px}
.stats3 small{display:block;color:var(--mut);font-size:12px}.stats3 b{font-size:17px}
.exh{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.exh .nm{flex:1;font-weight:700;color:var(--acc);min-width:0}
.exh button{padding:4px 9px;background:transparent;color:var(--mut)}
.srow{display:grid;gap:6px;align-items:center;margin:5px 0}
.srow.head{font-size:12px;color:var(--mut);text-align:center}
.srow .sn{text-align:center;color:var(--mut);font-weight:600}
.srow input{text-align:center;padding:9px 4px}
.srow .prev{background:transparent;color:var(--mut);padding:6px 2px;font-size:14px}
.srow .chk{padding:8px 0;background:var(--card2);color:var(--mut)}
.srow.done{background:rgba(46,204,113,.12);border-radius:10px}
.srow.done .chk{background:var(--ok);color:#fff}
.srow .del{background:transparent;color:var(--mut);padding:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:#12151b;border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe);z-index:5}
nav button{flex:1;background:transparent;border-radius:0;padding:9px 0 8px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}nav button.on{color:var(--acc)}
#rest{position:fixed;left:10px;right:10px;bottom:calc(62px + var(--safe));background:var(--card2);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;z-index:6;box-shadow:0 4px 18px rgba(0,0,0,.5);overflow:hidden}
#rest[hidden]{display:none}
#rest .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,107,53,.25);width:0;transition:width 1s linear}
#rest>*{position:relative}#rest #resttime{font-size:22px;font-weight:700;flex:1}
#sheet,#sheet2{position:fixed;inset:0;z-index:20;display:none}#sheet2{z-index:30}
#sheet.on,#sheet2.on{display:block}
.back{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:90vh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 14px calc(20px + var(--safe));max-width:640px;margin:0 auto}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.chip{white-space:nowrap;padding:6px 12px;border-radius:99px;font-size:14px;background:var(--card2);color:var(--mut)}
.chip.on{background:var(--acc);color:#fff}
.li{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);gap:8px}
.li.sel{background:rgba(255,107,53,.15)}
.seg{display:flex;gap:6px}.seg button{flex:1}.seg button.on{background:var(--acc);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{background:var(--card);border-radius:12px;padding:10px}.kv small{display:block;color:var(--mut);font-size:12px}.kv b{font-size:18px}
svg.chart{width:100%;height:auto;display:block}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + var(--safe));background:#000c;padding:10px 16px;border-radius:99px;z-index:50;display:none;font-size:14px}
label.lb{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.pr{color:#ffd23f;font-weight:600}
.how{margin:0;padding-left:20px}.how li{margin:6px 0}
.tip{margin-top:10px;padding:8px 10px;border-radius:10px;background:rgba(255,107,53,.12);font-size:14px}
.pname{font-weight:700}.pitem{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:13px;color:var(--mut)}.pitem span:first-child{cursor:pointer;text-decoration:underline dotted}
h2 .sm{font-weight:400}
</style>
</head>
<body>
<div id="app"></div>
<div id="rest" hidden>
  <i class="fill" id="restfill"></i>
  <span id="resttime">0:00</span>
  <button data-act="restMinus">−15</button>
  <button data-act="restPlus">+15</button>
  <button data-act="restSkip">Skip</button>
</div>
<nav id="nav"></nav>
<div id="sheet"></div>
<div id="sheet2"></div>
<div id="toast"></div>
<input type="file" id="file" accept="application/json,.json" hidden>

<script>
'use strict';
/* ---------- seed exercises ---------- */
const SEED=`# Chest
Bench Press (Barbell)
Incline Bench Press (Barbell)
Decline Bench Press (Barbell)
Bench Press (Dumbbell)
Incline Bench Press (Dumbbell)
Chest Press (Machine)
Chest Fly (Dumbbell)
Chest Fly (Machine)
Cable Crossover
Push Up|reps
Chest Dip|reps
# Back
Deadlift (Barbell)
Bent Over Row (Barbell)
Pull Up|reps
Chin Up|reps
Lat Pulldown (Cable)
Seated Cable Row
One Arm Row (Dumbbell)
T-Bar Row
Straight Arm Pulldown
Back Extension|reps
# Shoulders
Overhead Press (Barbell)
Shoulder Press (Dumbbell)
Arnold Press
Lateral Raise (Dumbbell)
Lateral Raise (Cable)
Front Raise (Dumbbell)
Rear Delt Fly (Dumbbell)
Reverse Fly (Machine)
Face Pull
Upright Row
Shrug (Dumbbell)
Shrug (Barbell)
# Biceps
Bicep Curl (Barbell)
Bicep Curl (Dumbbell)
Hammer Curl
Preacher Curl
Incline Curl
Cable Curl
Concentration Curl
# Triceps
Triceps Pushdown (Cable)
Skullcrusher (Barbell)
Overhead Triceps Extension
Close Grip Bench Press
Triceps Dip|reps
Bench Dip|reps
Triceps Kickback
# Quads
Squat (Barbell)
Front Squat
Leg Press
Leg Extension
Hack Squat
Goblet Squat
Bulgarian Split Squat
Lunge (Dumbbell)
Walking Lunge
Step Up
# Hamstrings
Romanian Deadlift
Stiff Leg Deadlift
Lying Leg Curl
Seated Leg Curl
Good Morning
Glute Ham Raise|reps
# Glutes
Hip Thrust (Barbell)
Glute Bridge
Cable Kickback
Hip Abduction (Machine)
# Calves
Standing Calf Raise
Seated Calf Raise
Calf Press
# Core
Plank|time
Side Plank|time
Crunch|reps
Sit Up|reps
Hanging Leg Raise|reps
Cable Crunch
Russian Twist|reps
Ab Wheel Rollout|reps
# Cardio
Running|time
Walking|time
Cycling|time
Rowing Machine|time
Stair Climber|time
Jump Rope|time`;
const MUSCLES=['Chest','Back','Shoulders','Biceps','Triceps','Quads','Hamstrings','Glutes','Calves','Core','Cardio','Other'];
const TYPES={wr:'Weight & reps',reps:'Bodyweight reps',time:'Duration (sec)'};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
function seedExercises(){const out=[];let m='Other';
  SEED.split('\n').forEach(l=>{l=l.trim();if(!l)return;
    if(l[0]==='#'){m=l.slice(1).trim();return}
    const [name,type]=l.split('|');out.push({id:'s_'+slug(name),name,muscle:m,type:type||'wr',custom:false})});
  return out}

/* ---------- state ---------- */
const KEY='ironlog.v1'; /* unchanged on purpose so existing saved data keeps loading */
const fresh=()=>({exercises:seedExercises(),routines:[],workouts:[],active:null,settings:{unit:'kg',rest:90}});
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.exercises)&&Array.isArray(d.workouts)){d.routines=d.routines||[];d.settings=Object.assign({unit:'kg',rest:90},d.settings);return d}}catch(e){}return fresh()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save — storage full?')}}
/* ---------- how-to instructions (built-in exercises) ---------- */
const INFOTXT=`@Bench Press (Barbell)
Lie on the bench with eyes under the bar, feet flat, shoulder blades pinched together and down.
Grip the bar slightly wider than shoulder width and unrack it over your shoulders.
Lower the bar under control to your mid-chest, elbows about 45–70° from your torso.
Press up and slightly back until your arms are straight.
! Keep your glutes on the bench and use a spotter or safety arms for heavy sets.
@Incline Bench Press (Barbell)
Set the bench to 30–45° and lie back with feet planted and shoulder blades tucked.
Unrack with a shoulder-width-plus grip and hold the bar over your upper chest.
Lower to your upper chest with control.
Press back up until your arms lock out.
! A steeper angle shifts work to the shoulders — 30° is usually the sweet spot.
@Decline Bench Press (Barbell)
Secure your legs on a decline bench and lie back with the bar over your lower chest.
Unrack and lower the bar to your lower chest.
Press up to full arm extension.
! Use a spotter; it's harder to bail out of a heavy decline rep.
@Bench Press (Dumbbell)
Sit with dumbbells on your thighs, then lie back and kick them up to chest height.
Start with arms straight above your chest, palms facing forward.
Lower until your upper arms are just below parallel with the bench.
Press back up, bringing the dumbbells together without clanging them.
! Dumbbells allow a bigger stretch than a bar — control the bottom position.
@Incline Bench Press (Dumbbell)
Set the bench to 30–45° and sit back with the dumbbells at your shoulders.
Press them up until your arms are straight above your upper chest.
Lower slowly until you feel a stretch across your chest.
! Keep wrists stacked over elbows throughout.
@Chest Press (Machine)
Adjust the seat so the handles line up with the middle of your chest.
Sit back with your shoulder blades against the pad and grip the handles.
Press forward until your arms are almost straight.
Return slowly until you feel a stretch, without letting the stack touch down.
! Don't let your shoulders roll forward at the end of each rep.
@Chest Fly (Dumbbell)
Lie on a flat bench with dumbbells above your chest, palms facing each other and a slight bend in the elbows.
Open your arms in a wide arc until you feel a deep chest stretch.
Squeeze the dumbbells back together over your chest along the same arc.
! Keep the elbow bend fixed — if it straightens and bends, it turns into a press.
@Chest Fly (Machine)
Set the seat so the handles are at chest height.
Sit back with your chest up and grip the handles with a slight elbow bend.
Bring the handles together in front of you and squeeze.
Return slowly to a comfortable stretch.
! Pause for a second at the squeeze for a better contraction.
@Cable Crossover
Set the pulleys high and stand in a split stance holding a handle in each hand.
Lean slightly forward with a slight elbow bend.
Sweep your hands down and together in front of your hips.
Return slowly until your chest is stretched.
! Move only at the shoulder — your elbows shouldn't bend more as you pull.
@Push Up
Start in a high plank, hands just wider than your shoulders, body in a straight line.
Lower your chest to just above the floor, elbows about 45° from your body.
Push the floor away until your arms are straight.
! Squeeze your glutes and abs so your hips don't sag. Drop to your knees if needed.
@Chest Dip
Grip the parallel bars and lift yourself with arms straight.
Lean your torso forward and let your legs hang or cross behind you.
Lower until your upper arms are about parallel to the floor.
Press back up to straight arms.
! Leaning forward targets the chest; staying upright targets the triceps.
@Deadlift (Barbell)
Stand with the bar over mid-foot, feet hip-width apart.
Hinge down and grip the bar just outside your legs. Chest up, back flat, shoulders over the bar.
Brace your core and push the floor away, keeping the bar against your legs.
Stand tall at the top, then lower by hinging at the hips first, then bending the knees.
! Never round your lower back. If it rounds, reduce the weight.
@Bent Over Row (Barbell)
Hold the bar with an overhand grip and hinge forward until your torso is about 45° with a flat back.
Let the bar hang below your knees with arms straight.
Row the bar to your lower ribs, driving your elbows back.
Lower with control.
! Don't use momentum — keep your torso angle fixed.
@Pull Up
Hang from a bar with an overhand grip a little wider than your shoulders.
Pull your shoulder blades down, then drive your elbows toward your hips.
Pull until your chin clears the bar.
Lower fully until your arms are straight.
! Avoid kipping. Use a band or negatives if you can't do full reps yet.
@Chin Up
Hang from the bar with an underhand, shoulder-width grip.
Pull yourself up until your chin is over the bar.
Lower under control to a full hang.
! Keep your chest up and think about pulling your elbows down to your sides.
@Lat Pulldown (Cable)
Sit with your thighs secured under the pads and grab the bar slightly wider than your shoulders.
Lean back a few degrees with your chest up.
Pull the bar to your upper chest, driving your elbows down.
Let the bar rise slowly until your arms are straight.
! Don't swing your torso or pull the bar behind your neck.
@Seated Cable Row
Sit with your feet on the plates and knees slightly bent, holding the handle with arms extended.
Sit tall with your chest up.
Pull the handle to your lower stomach, squeezing your shoulder blades together.
Return slowly, letting your shoulders stretch forward slightly.
! Keep your torso mostly still; don't rock back to move the weight.
@One Arm Row (Dumbbell)
Place one knee and the same-side hand on a bench, other foot on the floor.
Hold a dumbbell with your free hand, arm hanging straight.
Row the dumbbell toward your hip, keeping your elbow close to your body.
Lower slowly to a full stretch.
! Keep your back flat and hips square — don't twist as you pull.
@T-Bar Row
Straddle the bar, hinge forward with a flat back and grab the handle.
Pull the weight toward your chest, driving your elbows back.
Squeeze your shoulder blades together at the top.
Lower under control.
! Keep your head neutral — look at the floor a little ahead of you.
@Straight Arm Pulldown
Stand facing a high cable with a bar or rope, arms straight, slight hinge at the hips.
Keeping your arms nearly straight, sweep the bar down to your thighs.
Pause and feel your lats squeeze.
Return slowly overhead.
! Move from your shoulders, not your elbows.
@Back Extension
Set the pad at hip level on a back extension bench with feet secured.
Cross your arms and keep your body straight from head to heels.
Lower your torso by hinging at the hips.
Raise back up until your body is in a straight line.
! Stop at a straight line — leaning back past it just stresses the lower back.
@Overhead Press (Barbell)
Hold the bar at your collarbone with a grip just outside your shoulders.
Brace your core and squeeze your glutes.
Press the bar straight up, moving your head back slightly then through as it passes.
Lock out overhead, then lower back to your collarbone.
! Don't lean back — keep ribs down and glutes tight.
@Shoulder Press (Dumbbell)
Sit or stand with the dumbbells at shoulder height, palms facing forward.
Press up until your arms are straight above you.
Lower back to ear level under control.
! Keep your core tight so your lower back doesn't arch.
@Arnold Press
Start with dumbbells in front of your shoulders, palms facing you.
Press up while rotating your palms to face forward.
Finish with arms straight overhead.
Reverse the rotation as you lower.
! Use lighter weights than a normal press — the rotation makes it harder.
@Lateral Raise (Dumbbell)
Stand with a dumbbell in each hand at your sides and a slight elbow bend.
Raise your arms out to the sides until they're about shoulder height.
Lower slowly.
! Lead with your elbows and don't shrug. Light weight with strict form works best.
@Lateral Raise (Cable)
Stand side-on to a low cable and grab the handle with the far hand.
Raise your arm out to the side to shoulder height.
Lower slowly against the cable's tension.
! The cable keeps constant tension at the bottom, so don't rest between reps.
@Front Raise (Dumbbell)
Stand holding dumbbells in front of your thighs.
Raise one or both arms straight in front of you to shoulder height.
Lower under control.
! Don't swing your body — if you need to, the weight is too heavy.
@Rear Delt Fly (Dumbbell)
Hinge forward at the hips with a flat back, dumbbells hanging below your chest.
With a slight elbow bend, raise your arms out to the sides.
Squeeze your shoulder blades together at the top.
Lower slowly.
! Use light weights — the rear delts are small.
@Reverse Fly (Machine)
Sit facing the pad with your chest against it and grab the handles.
Pull the handles out and back in a wide arc, keeping your arms almost straight.
Squeeze your shoulder blades together.
Return slowly.
! Keep your shoulders down — don't shrug.
@Face Pull
Set a rope at upper-chest to face height.
Pull the rope toward your face, splitting the ends apart by your ears.
Squeeze your shoulder blades together and hold briefly.
Return slowly.
! Great for shoulder health. Use light weight and high reps.
@Upright Row
Hold a bar or dumbbells in front of your thighs with a shoulder-width grip.
Pull straight up along your body, leading with your elbows.
Stop around chest height.
Lower slowly.
! Keep the grip wide and don't lift elbows far above your shoulders if it pinches.
@Shrug (Dumbbell)
Stand holding dumbbells at your sides.
Lift your shoulders straight up toward your ears.
Hold for a second, then lower slowly.
! Don't roll your shoulders — just straight up and down.
@Shrug (Barbell)
Hold a barbell in front of your thighs with an overhand grip.
Shrug your shoulders straight up as high as you can.
Hold briefly, then lower slowly.
! Keep your arms straight — the movement comes from the traps, not the biceps.
@Bicep Curl (Barbell)
Stand holding a barbell with an underhand shoulder-width grip.
Keep your elbows pinned to your sides and curl the bar up to shoulder height.
Squeeze, then lower slowly to full arm extension.
! Don't swing your back to move the bar.
@Bicep Curl (Dumbbell)
Stand with a dumbbell in each hand, palms facing forward.
Curl the weights up while keeping your elbows by your sides.
Squeeze at the top and lower slowly.
! Alternate arms or do both together — either works.
@Hammer Curl
Hold dumbbells with palms facing each other.
Curl up without rotating your wrists, elbows tucked in.
Lower slowly.
! Hits the brachialis and forearms as well as the biceps.
@Preacher Curl
Sit at a preacher bench with your upper arms resting flat on the pad.
Curl the bar or dumbbells up toward your shoulders.
Lower slowly until your arms are almost straight.
! Don't fully lock out at the bottom with heavy weight — that stresses the elbow.
@Incline Curl
Sit back on an incline bench (about 60°) with dumbbells hanging at your sides.
Curl up without moving your upper arms forward.
Lower slowly to a full stretch.
! The stretched position at the bottom is where this exercise shines.
@Cable Curl
Stand facing a low cable with a bar or rope attachment.
Curl the handle up, keeping your elbows by your sides.
Squeeze at the top and lower slowly.
! The cable keeps tension on the biceps through the whole rep.
@Concentration Curl
Sit on a bench with your elbow braced against your inner thigh.
Curl the dumbbell up toward your shoulder.
Squeeze, then lower under control.
! Slow and strict — don't lean back to help.
@Triceps Pushdown (Cable)
Stand facing a high cable with a bar or rope, elbows pinned to your sides.
Push down until your arms are fully straight.
Return until your forearms are just past parallel with the floor.
! Don't let your elbows drift forward or flare out.
@Skullcrusher (Barbell)
Lie on a bench holding a bar (or EZ-bar) above your chest with straight arms.
Bend only your elbows to lower the bar toward your forehead or just behind your head.
Extend your arms back up.
! Keep your upper arms vertical and still. Use a spotter for heavier weights.
@Overhead Triceps Extension
Hold a dumbbell or cable handle overhead with both hands, elbows pointing forward.
Lower the weight behind your head by bending your elbows.
Extend back up until your arms are straight.
! Keep your elbows close to your ears and your core tight.
@Close Grip Bench Press
Lie on a bench and grip the bar about shoulder-width apart.
Lower the bar to your lower chest with your elbows tucked close.
Press up until your arms are straight.
! Don't go much narrower than shoulder width — it strains the wrists.
@Triceps Dip
Support yourself on parallel bars with straight arms, torso upright.
Lower until your upper arms are about parallel with the floor, elbows pointing back.
Press back up to straight arms.
! Staying upright keeps the focus on your triceps rather than your chest.
@Bench Dip
Sit on the edge of a bench with hands beside your hips, then slide your hips off the front.
Lower your body by bending your elbows to about 90°.
Press back up to straight arms.
! Keep your hips close to the bench. Bend your knees to make it easier.
@Triceps Kickback
Hinge forward with a flat back and your upper arm parallel to the floor, holding a dumbbell.
Extend your elbow to straighten your arm behind you.
Squeeze, then bring it back slowly.
! Keep your upper arm still — only your forearm moves.
@Squat (Barbell)
Set the bar on your upper back, feet shoulder-width apart, toes slightly out.
Brace your core, take a big breath, and sit down and back.
Lower until your thighs are at least parallel to the floor, knees tracking over your toes.
Drive up through your whole foot to stand tall.
! Keep your chest up and the bar over mid-foot. Use safety bars in a rack.
@Front Squat
Rest the bar on your front shoulders, elbows high, upper arms parallel to the floor.
Squat down while keeping your torso as upright as possible.
Drive up through your feet to stand.
! If the elbows drop, the bar rolls forward — keep them high.
@Leg Press
Sit in the machine with your feet shoulder-width apart in the middle of the platform.
Release the safety and lower the platform until your knees are about 90°.
Press back up without locking your knees.
! Keep your lower back and hips flat against the seat the whole time.
@Leg Extension
Sit in the machine with the pad on your lower shins and knees lined up with the pivot.
Extend your legs until they are straight.
Squeeze your quads, then lower slowly.
! Control the lowering — don't let the weight crash down.
@Hack Squat
Position your shoulders under the pads with feet shoulder-width on the platform.
Release the safety and lower until your knees reach about 90° or lower.
Drive back up without locking out.
! Placing your feet lower targets quads more; higher shifts work to glutes.
@Goblet Squat
Hold a dumbbell or kettlebell against your chest with both hands.
Squat down between your knees, keeping your chest up.
Stand back up by driving through your feet.
! A great way to learn the squat pattern. Use your elbows to push your knees out.
@Bulgarian Split Squat
Stand a stride in front of a bench and rest the top of your back foot on it.
Lower straight down until your front thigh is parallel to the floor.
Drive through your front heel to stand.
! Keep most of your weight on the front leg and your torso slightly forward.
@Lunge (Dumbbell)
Stand holding dumbbells at your sides.
Step forward and lower until both knees are around 90°.
Push off your front foot to return to the start.
! Keep your front knee above your ankle, and your torso upright.
@Walking Lunge
Take a big step forward and lower your back knee toward the floor.
Push through the front foot and bring your back leg through into the next step.
Continue alternating legs as you walk forward.
! Take long steps and keep your torso tall for better glute work.
@Step Up
Stand facing a bench or box with a dumbbell in each hand if desired.
Place one foot fully on the box and drive through it to stand on top.
Step back down under control and repeat.
! Don't push off the back foot — let the lead leg do the work.
@Romanian Deadlift
Stand holding a bar or dumbbells in front of your thighs with a slight knee bend.
Push your hips straight back, keeping the weight close to your legs.
Lower until you feel a strong hamstring stretch, usually just below the knees.
Drive your hips forward to stand tall.
! Keep your back flat — this is a hip hinge, not a squat.
@Stiff Leg Deadlift
Stand holding a bar with your legs almost straight.
Hinge at the hips and lower the bar down your legs.
Stand back up by squeezing your glutes.
! Stop when your lower back wants to round, even if the bar hasn't reached the floor.
@Lying Leg Curl
Lie face down on the machine with the pad just above your heels.
Curl your heels toward your glutes.
Squeeze, then lower slowly.
! Keep your hips pressed into the bench.
@Seated Leg Curl
Sit in the machine with the pad on the back of your lower legs, thighs secured.
Curl your heels down and back as far as you can.
Return slowly to the start.
! Keep your back against the pad and avoid jerking the weight.
@Good Morning
Place a light barbell on your upper back, feet shoulder-width apart, knees slightly bent.
Hinge at the hips, pushing them back until your torso is almost parallel to the floor.
Squeeze your glutes to return to standing.
! Start very light — this exercise punishes poor form.
@Glute Ham Raise
Secure your feet in the GHD with your knees just behind the pad.
Lower your torso toward the floor with a straight body.
Curl back up using your hamstrings and glutes.
! Cross your arms on your chest and keep your hips extended.
@Hip Thrust (Barbell)
Sit with your upper back against a bench and a padded barbell across your hips.
Plant your feet and drive through your heels to lift your hips.
Squeeze your glutes at the top until your torso is flat.
Lower and repeat.
! Tuck your chin and ribs down — don't over-arch your back at the top.
@Glute Bridge
Lie on your back with knees bent and feet flat on the floor.
Drive through your heels to lift your hips until your body forms a straight line.
Squeeze your glutes at the top, then lower.
! Add a barbell or dumbbell on your hips once bodyweight feels easy.
@Cable Kickback
Attach an ankle strap to a low cable and face the machine, holding it for support.
Kick your working leg straight back, squeezing your glute.
Return slowly without letting the weight stack touch down.
! Don't arch your lower back to get extra range of motion.
@Hip Abduction (Machine)
Sit in the machine with the pads on the outsides of your knees.
Push your knees apart as far as is comfortable.
Pause, then slowly bring them back together.
! Leaning forward slightly puts more emphasis on the glutes.
@Standing Calf Raise
Stand on the edge of a platform with the balls of your feet and the pads on your shoulders.
Lower your heels as far as possible for a deep stretch.
Rise up onto your toes as high as you can and pause.
! Go slow — pause at the top and bottom. No bouncing.
@Seated Calf Raise
Sit with your knees under the pad and the balls of your feet on the platform.
Lower your heels for a stretch.
Press up onto your toes and squeeze.
! The bent knee targets the soleus, so use higher reps.
@Calf Press
Sit in the leg press and place the balls of your feet on the bottom of the platform.
Press with your toes to extend your ankles.
Lower your heels for a full stretch and repeat.
! Keep your knees nearly straight but not locked.
@Plank
Rest on your forearms and toes with elbows directly under your shoulders.
Keep your body in a straight line from head to heels.
Squeeze your abs and glutes and breathe steadily.
Hold for the target time.
! If your hips sag or pike, end the set — quality over time.
@Side Plank
Lie on your side with your elbow under your shoulder.
Lift your hips so your body is in a straight line from head to feet.
Hold, then repeat on the other side.
! Do both sides for balance. Log each side as a set, or just the weaker side.
@Crunch
Lie on your back with knees bent and hands by your temples.
Curl your shoulders off the floor by contracting your abs.
Lower slowly without resting your head.
! Don't pull on your neck — the movement is small.
@Sit Up
Lie on your back with knees bent and feet flat.
Curl all the way up until your chest meets your thighs.
Lower slowly back down.
! Cross your arms over your chest and avoid yanking with your neck.
@Hanging Leg Raise
Hang from a bar with straight arms.
Raise your legs (bent or straight) until your hips curl up and your thighs reach parallel or higher.
Lower slowly without swinging.
! Tilt your pelvis up at the top — that's what works your abs, not just your hip flexors.
@Cable Crunch
Kneel under a high cable with a rope behind your head.
Crunch down, bringing your elbows toward your thighs while rounding your spine.
Return slowly.
! Move your spine, not your hips — keep your hips still.
@Russian Twist
Sit with knees bent, lean back slightly, and lift your feet if you can.
Rotate your torso to one side, then the other.
Hold a weight to make it harder.
! Turn from your ribcage, not just your arms.
@Ab Wheel Rollout
Kneel on a mat holding the wheel under your shoulders.
Roll out slowly while keeping your abs tight and back flat.
Roll back to the start by pulling with your abs.
! Only go as far as you can without your lower back sagging.
@Running
Warm up with a few minutes of walking or an easy jog.
Run at a pace where you can still speak in short sentences.
Land softly with your feet under your hips and keep a relaxed upper body.
Cool down with a few minutes of walking.
! Build up distance gradually — add no more than 10% per week.
@Walking
Walk at a brisk pace where you're breathing harder but can still talk.
Keep your head up, shoulders back and swing your arms.
! Brisk walking is easy on joints and great for recovery days.
@Cycling
Set the saddle height so your knee is slightly bent at the bottom of the pedal stroke.
Keep a steady cadence of around 70–90 rpm.
Increase the resistance for harder intervals.
! Keep your shoulders relaxed and your back straight.
@Rowing Machine
Start with your legs bent, arms straight, and shins vertical.
Push through your legs first, then lean back slightly, and finally pull the handle to your lower ribs.
Reverse the order to return: arms, then body, then knees.
! About 60% of the power comes from your legs.
@Stair Climber
Stand tall and step steadily, placing your whole foot on each step.
Use the handrails only for balance, not to hold your weight.
! Leaning on the rails reduces the work you're doing.
@Jump Rope
Hold the handles at hip height with your elbows close to your sides.
Turn the rope with your wrists and jump just high enough to clear it.
Land softly on the balls of your feet.
! Start with 30-second rounds and rest between them.

function chrono(){return S.workouts.slice().sort((a,b)=>a.start-b.start)}
function prevSets(exId,before){

function lineChart(pts,fmt){
  if(!pts.length)return '<p class="muted sm">No data yet — log a workout with this exercise.</p>';
  const W=320,H=160,L=40,R=10,T=12,B=24;
  let x0=Math.min(...pts.map(p=>p.x)),x1=Math.max(...pts.map(p=>p.x)),y0=Math.min(...pts.map(p=>p.y)),y1=Math.max(...pts.map(p=>p.y));
  if(x0===x1){x0-=864e5;x1+=864e5}
  if(y0===y1){y0=y0*.9;y1=y1*1.1+1}
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>H-B-(y-y0)/(y1-y0)*(H-T-B);
  const path=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">
  <line x1="${L}" y1="${Y(y0)}" x2="${W-R}" y2="${Y(y0)}" stroke="var(--line)"/><line x1="${L}" y1="${Y(y1)}" x2="${W-R}" y2="${Y(y1)}" stroke="var(--line)"/>
  <text x="${L-4}" y="${Y(y1)+4}" text-anchor="end" font-size="10" fill="var(--mut)">${fmt(y1)}</text>
  <text x="${L-4}" y="${Y(y0)+4}" text-anchor="end" font-size="10" fill="var(--mut)">${fmt(y0)}</text>
  <path d="${path}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round"/>
  ${pts.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5" fill="var(--acc)"/>`).join('')}
  <text x="${L}" y="${H-6}" font-size="10" fill="var(--mut)">${fmtDateY(pts[0].x)}</text>
  <text x="${W-R}" y="${H-6}" text-anchor="end" font-size="10" fill="var(--mut)">${fmtDateY(pts[pts.length-1].x)}</text></svg>`}
function barChart(vals,labels){
  const W=320,H=140,L=10,R=10,T=16,B=22,max=Math.max(1,...vals),bw=(W-L-R)/vals.length;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${vals.map((v,i)=>{const h=(H-T-B)*v/max,x=L+i*bw+bw*.15;
    return `<rect x="${x.toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${v?'var(--acc)':'var(--line)'}"/>
    <text x="${(x+bw*.35).toFixed(1)}" y="${(H-B-h-4).toFixed(1)}" text-anchor="middle" font-size="10" fill="var(--txt)">${v||''}</text>
    <text x="${(x+bw*.35).toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--mut)">${labels[i]}</text>`}).join('')}</svg>`}

function vHistory(){
  const list=S.workouts.slice().sort((a,b)=>b.start-a.start);
  return `<h1>History</h1>${list.map(w=>`<div class="card" data-act="viewWorkout" data-id="${w.id}"><div class="row-b"><b>${esc(w.name)}</b><span class="muted sm">${fmtDate(w.start)}</span></div>
  <div class="muted sm" style="margin:2px 0 8px">${fmtDur(w.end-w.start)} · ${fmtVol(volumeOf(w.items))} · ${w.items.reduce((a,i)=>a+i.sets.length,0)} sets</div><div class="sm">${summaryLines(w)}</div></div>`).join('')||'<p class="muted">Finished workouts show up here.</p>'}`}

function statExList(){return S.exercises.filter(e=>exHistory(e.id).length)}
function statChart(){
  const ex=exById(ui.statEx);const h=exHistory(ui.statEx);
  if(!ui.statEx)return '';
  const pts=h.map(x=>({x:x.t,y:ex.type==='wr'?dw(x.best1):ex.type==='time'?x.maxR:x.maxR}));
  return lineChart(pts,v=>Math.round(v*10)/10)+`<div class="muted sm">${ex.type==='wr'?'Best estimated 1-rep max per session ('+U()+')':ex.type==='time'?'Longest set per session (sec)':'Most reps in a set per session'}</div>`}
function vStats(){
  const ws=S.workouts,now=Date.now(),cur=weekStart(now),wk=ws.filter(w=>w.start>=cur);
  const vals=[],labs=[];for(let i=7;i>=0;i--){const a=cur-i*6048e5,b=a+6048e5;vals.push(ws.filter(w=>w.start>=a&&w.start<b).length);const d=new Date(a);labs.push(`${d.getDate()}/${d.getMonth()+1}`)}
  const withHist=statExList();if(!ui.statEx||!withHist.find(e=>e.id===ui.statEx))ui.statEx=withHist[0]?withHist[0].id:'';
  const prs=withHist.filter(e=>e.type==='wr').map(e=>{const h=exHistory(e.id);let bw=0,br=0,b1=0;h.forEach(x=>x.sets.forEach(s=>{if((s.w||0)>bw){bw=s.w;br=s.r}b1=Math.max(b1,e1rm(s.w,s.r))}));return {e,bw,br,b1}}).sort((a,b)=>b.b1-a.b1).slice(0,8);
  return `<h1>Stats</h1>
  <div class="grid2"><div class="kv"><small>This week</small><b>${wk.length} workouts</b></div><div class="kv"><small>Volume this week</small><b>${fmtVol(wk.reduce((a,w)=>a+volumeOf(w.items),0))}</b></div>
  <div class="kv"><small>All-time workouts</small><b>${ws.length}</b></div><div class="kv"><small>All-time volume</small><b>${fmtVol(ws.reduce((a,w)=>a+volumeOf(w.items),0))}</b></div></div>
  <h2>Workouts per week</h2><div class="card">${barChart(vals,labs)}</div>
  <h2>Exercise progress</h2><div class="card">${withHist.length?`<select data-f="statEx">${withHist.map(e=>`<option value="${e.id}" ${e.id===ui.statEx?'selected':''}>${esc(e.name)}</option>`).join('')}</select><div style="margin-top:10px" id="statchart">${statChart()}</div>`:'<p class="muted">Complete a workout to see progress charts.</p>'}</div>
  ${prs.length?`<h2>Personal records</h2><div class="card">${prs.map(p=>`<div class="li"><span>${esc(p.e.name)}</span><span class="sm"><b>${dw(p.bw)} ${U()} × ${p.br}</b> <span class="muted">· 1RM ≈ ${Math.round(dw(p.b1))}</span></span></div>`).join('')}</div>`:''}
  <h2>Settings & backup</h2><div class="card">
  <label class="lb" style="margin-top:0">Units</label><div class="seg"><button class="${U()==='kg'?'on':''}" data-act="unit" data-u="kg">kg</button><button class="${U()==='lb'?'on':''}" data-act="unit" data-u="lb">lb</button></div>
  <label class="lb">Default rest timer (seconds)</label><input inputmode="numeric" data-f="rest" value="${S.settings.rest}">
  <label class="lb">Your data lives only on this device. Back it up regularly.</label>
  <div class="grid2"><button class="btn" data-act="exportJson">Export backup</button><button class="btn" data-act="exportCsv">Export CSV</button></div>
  <button class="btn" style="width:100%;margin-top:8px" data-act="importJson">Import backup</button>
  <button class="btn danger" style="width:100%;margin-top:14px" data-act="resetAll">Erase all data</button></div>
  <p class="muted sm" style="text-align:center">Workout Tracker · free, offline, no account, no subscription</p>`}

const NAV=[['workout','🏋️','Workout'],['routines','📋','Routines'],['exercises','📚','Exercises'],['history','🕘','History'],['stats','📈','Stats']];
function render(){
  const y=window.scrollY;
  $('#app').innerHTML=({workout:vWorkout,routines:vRoutines,exercises:vExercises,history:vHistory,stats:vStats})[ui.tab]();
  $('#nav').innerHTML=NAV.map(([k,ic,l])=>`<button class="${ui.tab===k?'on':''}" data-act="tab" data-t="${k}"><span>${ic}${k==='workout'&&S.active?'•':''}</span>${l}</button>`).join('');
  updateRest();window.scrollTo(0,y)}

/* ---------- picker (layer 2) ---------- */
function pickerList(){const q=ui.pk.q.trim().toLowerCase();
  return S.exercises.filter(e=>(ui.pk.m==='All'||e.muscle===ui.pk.m)&&(!q||e.name.toLowerCase().includes(q))).sort((a,b)=>a.name.localeCompare(b.name))
    .map(e=>`<div class="li ${ui.pk.sel.has(e.id)?'sel':''}" data-act="pkToggle" data-id="${e.id}"><div><b>${esc(e.name)}</b><div class="muted sm">${esc(e.muscle)}</div></div><span>${ui.pk.sel.has(e.id)?'✓':''}</span></div>`).join('')||'<p class="muted">Nothing found.</p>'}
function openPicker(cb){ui.pk={sel:new Set(),q:'',m:'All',cb};drawPicker()}
function drawPicker(){sheet(`<div class="row-b"><h1 style="margin:0">Add exercises</h1><button class="btn sm acc" data-act="pkDone">Add (${ui.pk.sel.size})</button></div>
  <input data-f="pkq" placeholder="Search" value="${esc(ui.pk.q)}" style="margin-top:10px">
  <div class="chips">${['All',...MUSCLES].map(m=>`<button class="chip ${ui.pk.m===m?'on':''}" data-act="pkMuscle" data-m="${m}">${m}</button>`).join('')}</div>
  <div id="pklist">${pickerList()}</div><button class="btn ghost" style="width:100%;margin-top:10px" data-act="newExFromPicker">+ Create custom exercise</button>`,2)}

/* ---------- exercise editor / detail ---------- */
function exEditor(id,fromPicker){
  const e=id?exById(id):{name:'',muscle:'Chest',type:'wr'};ui.ex={id,fromPicker,name:e.name,muscle:e.muscle,type:e.type};
  sheet(`<h1>${id?'Edit':'New'} exercise</h1><label class="lb">Name</label><input data-f="exname" value="${esc(e.name)}" placeholder="e.g. Cable Pullover">
  <label class="lb">Muscle group</label><select data-f="exmuscle">${MUSCLES.map(m=>`<option ${m===e.muscle?'selected':''}>${m}</option>`).join('')}</select>
  <label class="lb">Type</label><select data-f="extype">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===e.type?'selected':''}>${v}</option>`).join('')}</select>
  <button class="btn big" data-act="saveEx">Save</button>`,fromPicker?2:1)}
function howTo(ex){const i=!ex.custom&&INFO[ex.name];if(!i)return '';
  return `<h2>How to do it</h2><div class="card"><ol class="how">${i.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>${i.tip?`<div class="tip">💡 ${esc(i.tip)}</div>`:''}</div>`}
function exDetail(id){
  const ex=exById(id),h=exHistory(id);
  let rec='';
  if(h.length){
    if(ex.type==='wr'){const mw=Math.max(...h.map(x=>x.maxW)),b1=Math.max(...h.map(x=>x.best1));
      rec=`<div class="grid2"><div class="kv"><small>Heaviest</small><b>${dw(mw)} ${U()}</b></div><div class="kv"><small>Best 1RM (est.)</small><b>${Math.round(dw(b1))} ${U()}</b></div><div class="kv"><small>Best set volume</small><b>${fmtVol(Math.max(...h.flatMap(x=>x.sets.map(s=>(s.w||0)*(s.r||0)))))}</b></div><div class="kv"><small>Sessions</small><b>${h.length}</b></div></div>`}
    else rec=`<div class="grid2"><div class="kv"><small>Best</small><b>${Math.max(...h.map(x=>x.maxR))} ${ex.type==='time'?'sec':'reps'}</b></div><div class="kv"><small>Sessions</small><b>${h.length}</b></div></div>`}
  const pts=h.map(x=>({x:x.t,y:ex.type==='wr'?dw(x.best1):x.maxR}));
  return `<div class="row-b"><h1 style="margin:0">${esc(ex.name)}</h1><button class="btn sm" data-act="close1">Close</button></div><div class="muted">${esc(ex.muscle)} · ${TYPES[ex.type]}</div>
  ${howTo(ex)}<h2>Records</h2>${rec||'<p class="muted">No history yet.</p>'}<h2>Progress</h2><div class="card">${lineChart(pts,v=>Math.round(v*10)/10)}</div>
  <h2>Recent sessions</h2>${h.slice(-5).reverse().map(x=>`<div class="li"><span>${fmtDate(x.t)}</span><span class="sm">${x.sets.map(s=>ex.type==='wr'?`${dw(s.w)}×${s.r}`:s.r).join(', ')}</span></div>`).join('')||'<p class="muted">–</p>'}
  ${ex.custom?`<div class="grid2" style="margin-top:14px"><button class="btn" data-act="editEx" data-id="${id}">Edit</button><button class="btn danger" data-act="delEx" data-id="${id}">Delete</button></div>`:''}`}

/* ---------- workout detail / summary ---------- */
function workoutDetail(id){
  const w=S.workouts.find(x=>x.id===id);if(!w)return '';
  return `<div class="row-b"><h1 style="margin:0">${esc(w.name)}</h1><button class="btn sm" data-act="close1">Close</button></div>
  <div class="muted sm">${fmtDate(w.start)} · ${fmtDur(w.end-w.start)} · ${fmtVol(volumeOf(w.items))}</div>
  ${w.items.map(it=>{const ex=exById(it.exId);return `<div class="card"><b style="color:var(--acc)">${esc(ex.name)}</b>${it.sets.map((s,j)=>`<div class="li"><span class="muted">Set ${j+1}</span><span>${ex.type==='wr'?`${dw(s.w)} ${U()} × ${s.r}`:ex.type==='time'?s.r+' sec':s.r+' reps'}</span></div>`).join('')}</div>`}).join('')}
  <div class="grid2"><button class="btn" data-act="repeatWorkout" data-id="${id}">Repeat</button><button class="btn" data-act="wToRoutine" data-id="${id}">Save as routine</button></div>
  <button class="btn danger" style="width:100%;margin-top:10px" data-act="delWorkout" data-id="${id}">Delete workout</button>`}

/* ---------- routine editor ---------- */
function drawRoutine(){const r=ui.rt;
  sheet(`<div class="row-b"><h1 style="margin:0">${r.id?'Edit':'New'} routine</h1><button class="btn sm acc" data-act="saveRoutine">Save</button></div>
  <label class="lb">Name</label><input data-f="rtname" value="${esc(r.name)}" placeholder="e.g. Push Day">
  ${r.items.map((it,i)=>`<div class="card"><div class="row-b"><b>${esc(exById(it.exId).name)}</b><button data-act="rtDel" data-i="${i}">🗑</button></div>
    <div class="row-b" style="margin-top:8px"><span class="muted">Sets</span><span><button data-act="rtSets" data-i="${i}" data-d="-1">−</button> <b style="padding:0 10px">${it.sets}</b> <button data-act="rtSets" data-i="${i}" data-d="1">+</button></span></div></div>`).join('')}
  <button class="btn big" data-act="rtAdd">+ Add Exercise</button><button class="btn ghost" style="width:100%" data-act="close1">Cancel</button>`)}

/* ---------- rest timer / clock ---------- */
let audio;
function beep(){try{navigator.vibrate&&navigator.vibrate([200,100,200]);audio=audio||new (window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(audio.currentTime+.35)}catch(e){}}
function updateRest(){
  const A=S.active,r=$('#rest');
  if(!A||!A.restEnd){r.hidden=true;return}
  const left=A.restEnd-Date.now();
  if(left<=0){A.restEnd=null;save();r.hidden=true;beep();toast('Rest over — next set!');return}
  r.hidden=false;const s=Math.ceil(left/1000);
  $('#resttime').textContent=`${Math.floor(s/60)}:${pad(s%60)}`;
  $('#restfill').style.width=(100*(1-left/(A.restTotal||left)))+'%'}
setInterval(()=>{updateRest();const el=$('#elapsed');if(el&&S.active)el.textContent=fmtDur(Date.now()-S.active.start)},1000);
async function keepAwake(){try{if(S.active&&navigator.wakeLock)await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)keepAwake()});

/* ---------- actions ---------- */
function startWorkout(items,name){S.active={id:uid(),name:name||workoutName(),start:Date.now(),items,restEnd:null};save();ui.tab='workout';sheet('');render();keepAwake();window.scrollTo(0,0)}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const ACT={
  tab(t){ui.tab=t.dataset.t;render();window.scrollTo(0,0)},
  close1(){sheet('');render()},close2(){sheet('',2)},
  startEmpty(){if(S.active)return render();startWorkout([])},
  startRoutine(t){if(S.active&&!confirm('A workout is in progress. Replace it?'))return;
    const r=S.routines.find(x=>x.id===t.dataset.id);if(!r)return;
    startWorkout(r.items.map(i=>({id:uid(),exId:i.exId,sets:Array.from({length:i.sets},blank)})),r.name)},
  startPreset(t){if(S.active&&!confirm('A workout is in progress. Replace it?'))return;
    const p=PRESETS.find(x=>x.id===t.dataset.id);if(!p)return;
    startWorkout(presetItems(p).map(i=>({id:uid(),exId:i.exId,sets:Array.from({length:i.sets},blank)})),p.name)},
  savePreset(t){const p=PRESETS.find(x=>x.id===t.dataset.id);if(!p)return;
    S.routines.push({id:uid(),name:p.name,items:presetItems(p).map(i=>({exId:i.exId,sets:i.sets}))});save();render();toast(p.name+' saved to your routines')},
  addEx(){openPicker(ids=>{ids.forEach(id=>S.active.items.push({id:uid(),exId:id,sets:[blank()]}));save();render()})},
  addSet(t){const it=S.active.items[+t.dataset.i];it.sets.push(blank());save();render()},
  delSet(t){const it=S.active.items[+t.dataset.i];it.sets.splice(+t.dataset.s,1);save();render()},
  delItem(t){if(!confirm('Remove this exercise from the workout?'))return;S.active.items.splice(+t.dataset.i,1);save();render()},
  moveItem(t){const a=S.active.items,i=+t.dataset.i,j=i+ +t.dataset.d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()},
  copyPrev(t){const it=S.active.items[+t.dataset.i],s=it.sets[+t.dataset.s],p=prevSets(it.exId,S.active.start)[+t.dataset.s];if(!p)return;s.w=p.w;s.r=p.r;save();render()},
  toggleSet(t){const A=S.active,it=A.items[+t.dataset.i],s=it.sets[+t.dataset.s],ty=exById(it.exId).type;
    if(!s.done){const p=prevSets(it.exId,A.start)[+t.dataset.s];
      if(s.r===''&&p&&p.r)s.r=p.r;if(ty==='wr'&&s.w===''&&p&&p.w!=null)s.w=p.w;
      if(s.r===''||(ty==='wr'&&s.w==='')){return toast(ty==='wr'?'Enter weight and reps first':'Enter a value first')}
      s.done=true;const rest=+S.settings.rest||0;if(rest>0&&ty!=='time'){A.restEnd=Date.now()+rest*1000;A.restTotal=rest*1000}
      try{audio=audio||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
    }else s.done=false;
    save();render()},
  restMinus(){const A=S.active;if(A&&A.restEnd){A.restEnd-=15000;A.restTotal=Math.max(1000,(A.restTotal||0)-15000);save();updateRest()}},
  restPlus(){const A=S.active;if(A&&A.restEnd){A.restEnd+=15000;A.restTotal=(A.restTotal||0)+15000;save();updateRest()}},
  restSkip(){const A=S.active;if(A){A.restEnd=null;save();updateRest()}},
  discard(){if(confirm('Discard this workout? Nothing will be saved.')){S.active=null;save();render()}},
  saveAsRoutine(){const A=S.active;if(!A.items.length)return toast('Add an exercise first');
    const n=prompt('Routine name',A.name);if(!n)return;
    S.routines.push({id:uid(),name:n.trim(),items:A.items.map(i=>({exId:i.exId,sets:i.sets.length}))});save();toast('Routine saved')},
  finish(){
    const A=S.active,done=A.items.map(it=>({exId:it.exId,sets:it.sets.filter(s=>s.done).map(s=>({w:s.w===''?0:s.w,r:s.r===''?0:s.r}))})).filter(it=>it.sets.length);
    if(!done.length){if(confirm('No completed sets. Discard this workout?')){S.active=null;save();render()}return}
    if(A.items.some(it=>it.sets.some(s=>!s.done))&&!confirm('Some sets are not ticked and will be dropped. Finish anyway?'))return;
    const w={id:A.id,name:A.name||workoutName(),start:A.start,end:Date.now(),items:done};
    const prs=[];done.forEach(it=>{const ex=exById(it.exId);if(ex.type!=='wr')return;
      const old=exHistory(it.exId);if(!old.length)return;
      const oW=Math.max(...old.map(x=>x.maxW)),o1=Math.max(...old.map(x=>x.best1));
      const nW=Math.max(...it.sets.map(s=>s.w||0)),n1=Math.max(...it.sets.map(s=>e1rm(s.w,s.r)));
      if(nW>oW)prs.push(`${ex.name}: heaviest set ${dw(nW)} ${U()}`);else if(n1>o1)prs.push(`${ex.name}: est. 1RM ${Math.round(dw(n1))} ${U()}`)});
    S.workouts.push(w);S.active=null;save();render();
    sheet(`<h1>Workout complete 🎉</h1><div class="stats3"><div><small>Time</small><b>${fmtDur(w.end-w.start)}</b></div><div><small>Volume</small><b>${fmtVol(volumeOf(w.items))}</b></div><div><small>Sets</small><b>${w.items.reduce((a,i)=>a+i.sets.length,0)}</b></div></div>
    ${prs.length?`<h2>New records</h2>${prs.map(p=>`<div class="li pr">🏆 ${esc(p)}</div>`).join('')}`:''}
    <button class="btn big" data-act="close1">Done</button>`)},
  /* routines */
  newRoutine(){ui.rt={id:null,name:'',items:[]};drawRoutine()},
  editRoutine(t){const r=S.routines.find(x=>x.id===t.dataset.id);ui.rt=JSON.parse(JSON.stringify(r));drawRoutine()},
  delRoutine(t){if(confirm('Delete this routine?')){S.routines=S.routines.filter(r=>r.id!==t.dataset.id);save();render()}},
  rtAdd(){openPicker(ids=>{ids.forEach(id=>ui.rt.items.push({exId:id,sets:3}));drawRoutine()})},
  rtDel(t){ui.rt.items.splice(+t.dataset.i,1);drawRoutine()},
  rtSets(t){const it=ui.rt.items[+t.dataset.i];it.sets=Math.max(1,Math.min(20,it.sets+ +t.dataset.d));drawRoutine()},
  saveRoutine(){const r=ui.rt;if(!r.name.trim())return toast('Give the routine a name');if(!r.items.length)return toast('Add at least one exercise');
    r.name=r.name.trim();if(r.id){const i=S.routines.findIndex(x=>x.id===r.id);S.routines[i]=r}else{r.id=uid();S.routines.push(r)}save();sheet('');render()},
  /* exercises */
  exMuscle(t){ui.exm=t.dataset.m;render()},
  newEx(){exEditor(null,false)},newExFromPicker(){exEditor(null,true)},
  editEx(t){exEditor(t.dataset.id,false)},
  exInfo(t){sheet(exDetail(t.dataset.id))},
  saveEx(){const x=ui.ex;if(!x.name.trim())return toast('Enter a name');
    if(x.id){const e=S.exercises.find(e=>e.id===x.id);e.name=x.name.trim();e.muscle=x.muscle;e.type=x.type}
    else{const id='c_'+uid();S.exercises.push({id,name:x.name.trim(),muscle:x.muscle,type:x.type,custom:true});if(x.fromPicker&&ui.pk)ui.pk.sel.add(id)}
    save();if(x.fromPicker){drawPicker()}else{sheet('');render()}},
  delEx(t){const id=t.dataset.id;if(S.workouts.some(w=>w.items.some(i=>i.exId===id))&&!confirm('This exercise is in your history. Delete anyway?'))return;
    S.exercises=S.exercises.filter(e=>e.id!==id);S.routines.forEach(r=>r.items=r.items.filter(i=>i.exId!==id));save();sheet('');render()},
  pkToggle(t){const s=ui.pk.sel,id=t.dataset.id;s.has(id)?s.delete(id):s.add(id);drawPicker();},
  pkMuscle(t){ui.pk.m=t.dataset.m;drawPicker()},
  pkDone(){const ids=[...ui.pk.sel],cb=ui.pk.cb;sheet('',2);if(ids.length)cb(ids)},
  /* history */
  viewWorkout(t){sheet(workoutDetail(t.dataset.id))},
  delWorkout(t){if(confirm('Delete this workout permanently?')){S.workouts=S.workouts.filter(w=>w.id!==t.dataset.id);save();sheet('');render()}},
  repeatWorkout(t){if(S.active&&!confirm('A workout is in progress. Replace it?'))return;const w=S.workouts.find(x=>x.id===t.dataset.id);startWorkout(w.items.map(i=>({id:uid(),exId:i.exId,sets:i.sets.map(blank)})),w.name)},
  wToRoutine(t){const w=S.workouts.find(x=>x.id===t.dataset.id),n=prompt('Routine name',w.name);if(!n)return;
    S.routines.push({id:uid(),name:n.trim(),items:w.items.map(i=>({exId:i.exId,sets:i.sets.length}))});save();toast('Routine saved')},
  /* settings */
  unit(t){S.settings.unit=t.dataset.u;save();render()},
  exportJson(){download(`workout-tracker-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(S,null,1),'application/json')},
  exportCsv(){const rows=[['date','workout','exercise','set','weight_kg','reps_or_seconds']];
    chrono().forEach(w=>w.items.forEach(it=>it.sets.forEach((s,j)=>rows.push([new Date(w.start).toISOString(),w.name,exById(it.exId).name,j+1,s.w||0,s.r||0]))));
    download('workout-tracker-workouts.csv',rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv')},
  importJson(){$('#file').click()},
  resetAll(){if(confirm('Erase ALL workouts, routines and custom exercises? This cannot be undone.')&&confirm('Really erase everything?')){S=fresh();save();render()}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=ACT[t.dataset.act];if(f){e.stopPropagation();f(t,e)}});
document.addEventListener('input',e=>{const t=e.target,f=t.dataset&&t.dataset.f;if(!f)return;
  if(f==='w'||f==='r'){const A=S.active,s=A&&A.items[+t.dataset.i]&&A.items[+t.dataset.i].sets[+t.dataset.s];if(!s)return;
    if(f==='w')s.w=tk(t.value);else{const n=parseInt(t.value,10);s.r=isNaN(n)?'':n}save()}
  else if(f==='wname'){S.active.name=t.value;save()}
  else if(f==='exq'){ui.exq=t.value;$('#exlist').innerHTML=exListHTML()}
  else if(f==='pkq'){ui.pk.q=t.value;$('#pklist').innerHTML=pickerList()}
  else if(f==='rtname')ui.rt.name=t.value;
  else if(f==='exname')ui.ex.name=t.value;
  else if(f==='rest'){const n=parseInt(t.value,10);S.settings.rest=isNaN(n)?0:Math.max(0,Math.min(900,n));save()}});
document.addEventListener('change',e=>{const t=e.target,f=t.dataset&&t.dataset.f;if(!f)return;
  if(f==='exmuscle')ui.ex.muscle=t.value;else if(f==='extype')ui.ex.type=t.value;
  else if(f==='statEx'){ui.statEx=t.value;$('#statchart').innerHTML=statChart()}});
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.exercises)||!Array.isArray(d.workouts))throw 0;
    if(!confirm(`Replace current data with this backup (${d.workouts.length} workouts)?`))return;
    S=Object.assign(fresh(),d);S.settings=Object.assign({unit:'kg',rest:90},d.settings);save();render();toast('Backup imported')}catch(err){toast('That is not a valid Workout Tracker backup')}};
  rd.readAsText(f);e.target.value=''});

/* ---------- init ---------- */
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();keepAwake();
</script>
</body>
</html>
